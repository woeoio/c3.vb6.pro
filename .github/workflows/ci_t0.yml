# ci_t0.yml - T0 最小编译门禁 (实验层)
#
# 与 ci.yml (push/PR 触发的全量回归) 完全独立, 本文件不被常规推送触发。
# 触发方式: 打 tag github-test-* 推送到 GitHub, 例如:
#   git tag github-test-001
#   git push <github 远端> github-test-001
# 内容: t0 job = build-once: 构建 C3.exe + 上传 c3-exe artifact + 跑完整 run_t0.ps1
#   门禁 (语法全量 + smoke e2e, 不分片, 保证 build/syntax/smoke 三段一次到位)。
#   tests job = 矩阵 fan-out (tier × shard): 复用 c3-exe artifact, 把 run_t1.ps1 (bas 64 任务
#   + compile) 与 run_t2.ps1 (vbp 8 + GUI 5) 按 -Shard/-ShardTotal 切给多 runner, 每 runner 内
#   再 -Jobs 20 并行 (每 worker 独立输出目录) —— 关键路径从 t0→t1→t2 串行压到 t0 + max(shard)。
#   用例均 cp 自 tests/, tests_github 自包含。shard 数是可调旋钮 (参照 ci.yml 的实测注释)。
# 触发: tag github-test-* / 夜间 cron / 手动 dispatch, 见 on: 块。

name: GitHub Tests T0+T1+T2

on:
  push:
    tags:
      - 'github-test-*'
  schedule:
    - cron: '7 19 * * *'   # UTC 19:07 = 北京 03:07, 夜间全链健康检查
  workflow_dispatch:

jobs:
  t0:
    name: T0 最小编译门禁（构建 + 语法 + 冒烟）
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    env:
      # 交给脚本的 vswhere 自动发现 vcvarsall (无需显式设置)
      C3_VCVARSALL: ""
    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      - name: 环境自检（MSVC 工具链）
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} "Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path $vswhere)) { throw "vswhere missing (VS installer absent)" }
          $vsPath = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath 2>$null
          if (-not $vsPath) { throw "No MSVC C++ tools found (needs VS C++ workload)" }
          Write-Host "MSVC install: $vsPath"
          cmake --version
          ninja --version

      - name: 缓存构建目录（src/ 未变时走快速路径）
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/c3build
          key: c3build-${{ hashFiles('src/**', 'CMakeLists.txt', 'cmake/**') }}
          restore-keys: c3build-

      - name: 从源码构建 C3.exe（绝不携带预编译二进制）
        shell: pwsh
        run: |
          # MSVC 官方只保证从 vcvarsall 拿到的环境有效; 这里在子进程里导出后注入当前进程。
          $vswhere = Join-Path ${env:ProgramFiles(x86)} "Microsoft Visual Studio\Installer\vswhere.exe"
          $vsPath = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath 2>$null
          if (-not $vsPath) { throw "No MSVC install" }
          $vcvars = Join-Path $vsPath "VC\Auxiliary\Build\vcvarsall.bat"
          $envLines = & cmd /c "call `"$vcvars`" x64 >nul 2>&1 && set" 2>$null
          foreach ($line in $envLines) {
            if ($line -match '^([^=]+)=(.*)$') {
              [Environment]::SetEnvironmentVariable($matches[1], $matches[2], "Process")
            }
          }
          $buildDir = Join-Path $env:RUNNER_TEMP "c3build"
          cmake -S . -B $buildDir -G Ninja -DVB6C3_ENABLE_LLVM=OFF -DCMAKE_BUILD_TYPE=Release
          if ($LASTEXITCODE -ne 0) { throw "cmake configure failed" }
          cmake --build $buildDir
          if ($LASTEXITCODE -ne 0) { throw "cmake build failed" }
          New-Item -ItemType Directory -Force -Path .build | Out-Null
          Copy-Item (Join-Path $buildDir "C3.exe") .build\C3.exe -Force
          & .build\C3.exe --version
          if ($LASTEXITCODE -ne 0) { throw "built C3.exe smoke check failed" }

      - name: 上传 C3.exe 产物（T1 复用，不重复构建）
        uses: actions/upload-artifact@v7
        with:
          name: c3-exe
          path: .build/C3.exe
          if-no-files-found: error
          retention-days: 1

      - name: 运行 T0 门禁（tests_github/run_t0.ps1）
        shell: pwsh
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File tests_github/run_t0.ps1 -Verbose

      - name: 上传 T0 日志
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: t0-logs
          path: |
            output/**/*.out
            output/**/*.err
          if-no-files-found: warn
          retention-days: 14

  tests:
    name: "Tests (${{ matrix.tier }} shard ${{ matrix.shard }}/${{ matrix.shardTotal }})"
    needs: t0
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    strategy:
      fail-fast: false
      matrix:
        include:
          # tier = 跑哪个脚本 (run_t1.ps1 / run_t2.ps1); shard/shardTotal 经 -Shard/-ShardTotal
          # 传给脚本, 各 runner 只执行完整清单的第 shard 片 (清单守卫仍对完整 33/64/8/5 校验)。
          # shardArgs 逐条显式写出 (参照 ci.yml), 不用表达式拼 —— 拼错时 GitHub 不报错、静默少传参。
          #
          # t1: bas 64 任务 (每 runner 内再 -Jobs 20 并行) 是 T0+T1+T2 的主要墙钟 → 切 4 片。
          #     compile 10 + smoke e2e 在 run_t1.ps1 里已锁 shard 1, 其余片自动跳过 (不减检查)。
          # t2: vbp 8 + GUI 5 = 13 工程编译 → 切 2 片 (每片约 7 例), 再加 -Jobs 并行。
          # 分片数按调用次序连续切片, 加用例不必改这里 (总数写不进代码)。
          - tier: t1
            shard: 1
            shardTotal: 4
            shardArgs: "-Shard 1 -ShardTotal 4"
          - tier: t1
            shard: 2
            shardTotal: 4
            shardArgs: "-Shard 2 -ShardTotal 4"
          - tier: t1
            shard: 3
            shardTotal: 4
            shardArgs: "-Shard 3 -ShardTotal 4"
          - tier: t1
            shard: 4
            shardTotal: 4
            shardArgs: "-Shard 4 -ShardTotal 4"
          - tier: t2
            shard: 1
            shardTotal: 2
            shardArgs: "-Shard 1 -ShardTotal 2"
          - tier: t2
            shard: 2
            shardTotal: 2
            shardArgs: "-Shard 2 -ShardTotal 2"
    env:
      # 交给脚本的 vswhere 自动发现 vcvarsall (无需显式设置)
      C3_VCVARSALL: ""
    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      - name: 下载 C3.exe 产物（来自 T0）
        uses: actions/download-artifact@v8
        with:
          name: c3-exe
          path: .build/

      - name: 校验下载的 C3.exe
        run: |
          & .build\C3.exe --version
          if ($LASTEXITCODE -ne 0) { throw "downloaded C3.exe broken" }

      # 每 runner 内 -Jobs 20 并行 (每 worker 独立输出目录 output/vbprun*、output/guicompile*、
      # output/job* — 从不依赖"最新临时目录"), 跨 runner 用 -Shard 切片。
      - name: "Run ${{ matrix.tier }} (shard ${{ matrix.shard }}/${{ matrix.shardTotal }})"
        shell: pwsh
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File tests_github/run_${{ matrix.tier }}.ps1 -Jobs 20 ${{ matrix.shardArgs }} -Verbose

      - name: "上传 ${{ matrix.tier }} shard ${{ matrix.shard }} 日志"
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: "${{ matrix.tier }}-${{ matrix.shard }}-logs"
          path: |
            output/**/*.out
            output/**/*.err
            output/**/*.txt
            output/**/scores.txt
          if-no-files-found: warn
          retention-days: 14
