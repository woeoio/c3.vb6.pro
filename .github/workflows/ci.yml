name: VB6 C3 Regression

on:
  # main 分支已删除 (内容全在 dev 里, 2026-09-25), 默认分支 = dev。
  # 注意 gate/* 分支不在此列 → 必须手动 `gh workflow run ci.yml --ref <branch>` 才会触发。
  push:
    branches: [dev]
  pull_request:
    branches: [dev]
  workflow_dispatch:

jobs:
  build:
    name: Build C3.exe
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    env:
      # 交给脚本的 vswhere 自动发现 vcvarsall (无需显式设置)
      C3_VCVARSALL: ""
    steps:
      - uses: actions/checkout@v5

      - name: Sanity — required dev tools (MSVC)
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} "Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path $vswhere)) { throw "vswhere missing (VS installer absent)" }
          $vsPath = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath 2>$null
          if (-not $vsPath) { throw "No MSVC C++ tools found (needs VS C++ workload)" }
          Write-Host "MSVC install: $vsPath"
          cmake --version
          ninja --version

      # 直接缓存**编好的 C3.exe**（不只是 ninja 构建目录）。原因：下面那个 c3build 目录缓存
      # 其实救不了重编 —— 缓存 tar 保留的是**旧 mtime**，而 checkout 出来的源码是**刚写的 mtime**，
      # ninja 一比「源比 obj 新」就把 128 个 TU 全重编（实测门 #880 的 Build job = 210s，日志里
      # [1/128]..[128/128] 一个不少）。key 与 c3build 同源（src/** + cmake），src 没动就直接把这枚
      # exe 拿来用、整个构建步骤跳过；src 动了 key 变了自然重编（本来就该重编）。
      - name: Cache built C3.exe (skip rebuild when src/ unchanged)
        id: c3exe
        uses: actions/cache@v6
        with:
          path: .build/C3.exe
          key: c3exe-${{ hashFiles('src/**', 'CMakeLists.txt', 'cmake/**') }}

      - name: Cache C3.exe build dir (fast path when src/ untouched)
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/c3build
          key: c3build-${{ hashFiles('src/**', 'CMakeLists.txt', 'cmake/**') }}
          restore-keys: c3build-

      # sccache: 编译缓存。构建每次 src 变更都要全编 128 个 TU（实测门 #881 Build=253s），
      # 而多数 TU 在两次提交间不变 —— sccache 按「预处理后源 + 编译器身份 + flags」做键，命中即
      # 跳过本次 cl 调用。实测（probe 分支两支：冷 290s / 热 84s、123/123 命中）⇒ 构建步骤提速约 3×。
      # 装不上就退回直接编（install 是 best-effort），不给门添红风险。cache key 只用 runner.os：
      # 编译器身份已经进了 sccache 自己的键，镜像滚动时自然整批 miss 重编一次（不误用旧对象）。
      # 与 ci_t0.yml 同一口径（那里实测出两个坑，这里是同一个病）：
      #   ① save key 必须每次不同（带 run_id），否则一旦命中既有 key，actions/cache 就再也不存新版本
      #      ⇒ 本轮刚编的对象回不到 cache，下一轮接着 0 命中；runner 镜像滚动（编译器身份进 sccache
      #      自己的键）之后尤其明显。restore-keys 负责捡最近那一份。
      #   ② 把落地的 exe 一起缓存，免掉每轮一次不可复用的 `choco install`（ci_t0 上实测 54s）。
      # ⚠ 顺序：缓存恢复必须排在 Install **之前**。放在其后的话，Install 那一步永远看不到上一轮的
      #   tools/（还没被恢复出来），于是每轮都白装一次 choco（ci_t0 上实测 54s）。
      - name: Cache sccache
        if: steps.c3exe.outputs.cache-hit != 'true'
        uses: actions/cache@v6
        with:
          path: |
            ${{ runner.temp }}/sccache
            ${{ runner.temp }}/sccache-bin
          key: sccache-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            sccache-${{ runner.os }}-

      - name: Install sccache (best-effort)
        id: sccache
        if: steps.c3exe.outputs.cache-hit != 'true'
        continue-on-error: true
        shell: pwsh
        run: |
          $binDir = Join-Path $env:RUNNER_TEMP "sccache-bin"
          New-Item -ItemType Directory -Force -Path $binDir | Out-Null
          $tools = Join-Path $binDir "tools"
          # ⚠ 与 ci_t0.yml 同一条纪律：choco 落在 bin\sccache.exe 的是一枚 **shim**，按相对路径
          #   ..\lib\sccache\tools\<ver>\sccache.exe 找本体；只拷这枚 shim 到别处会炸（ci_t0 上实测
          #   FAILED [code=4294967295] "Cannot find file at '..\lib\sccache\tools\...'"）。
          #   所以连 tools 子树一起搬，且 USE_SCCACHE 指向**真本体**（绝不用 Get-Command 拿到的 shim）。
          $exe = $null
          if (Test-Path $tools) {
            $exe = (Get-ChildItem $tools -Recurse -Filter sccache.exe -ErrorAction SilentlyContinue | Select-Object -First 1).FullName
          }
          if ($exe -and (Test-Path $exe)) {
            Write-Host "sccache from cache: $exe"
          } else {
            choco install sccache -y --no-progress 2>&1 | Out-Null
            $src = Join-Path ${env:ChocolateyInstall} "lib\sccache\tools"
            if (-not $src -or -not (Test-Path $src)) { $src = "C:\ProgramData\chocolatey\lib\sccache\tools" }
            if (Test-Path $src) { Copy-Item $src $tools -Recurse -Force }
            $exe = (Get-ChildItem $tools -Recurse -Filter sccache.exe -ErrorAction SilentlyContinue | Select-Object -First 1).FullName
          }
          if ($exe -and (Test-Path $exe)) {
            Write-Host "sccache available: $exe"
            & $exe --version
            "USE_SCCACHE=$exe" | Out-File -FilePath $env:GITHUB_ENV -Append
          } else {
            Write-Host "sccache not available; build will run without it"
          }
        env:
          SCCACHE_DIR: ${{ runner.temp }}/sccache
          SCCACHE_CACHE_SIZE: 2G

      - name: Build C3.exe from source (never ship a vendored binary)
        if: steps.c3exe.outputs.cache-hit != 'true'
        shell: pwsh
        env:
          SCCACHE_DIR: ${{ runner.temp }}/sccache
          SCCACHE_CACHE_SIZE: 2G
        run: |
          # MSVC 官方只保证从 vcvarsall 拿到的环境有效; 这里在子进程里导出后注入当前进程。
          $vswhere = Join-Path ${env:ProgramFiles(x86)} "Microsoft Visual Studio\Installer\vswhere.exe"
          $vsPath = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath 2>$null
          if (-not $vsPath) { throw "No MSVC install" }
          $vcvars = Join-Path $vsPath "VC\Auxiliary\Build\vcvarsall.bat"
          $envLines = & cmd /c "call `"$vcvars`" x64 >nul 2>&1 && set" 2>$null
          foreach ($line in $envLines) {
            if ($line -match '^([^=]+)=(.*)$') {
              [Environment]::SetEnvironmentVariable($matches[1], $matches[2], "Process")
            }
          }
          $buildDir = Join-Path $env:RUNNER_TEMP "c3build"
          # 关键（修 #896 ci_t0.yml 红）：launcher 必须**每次显式给值**，没有就给空。
          # 原因：ci.yml 用过一次 "-DCMAKE_CXX_COMPILER_LAUNCHER=..."，CMake 就把它持久化进
          # $buildDir/CMakeCache.txt；而这个目录正是 actions/cache 缓存的东西（key = c3build-<hash>，
          # ci_t0.yml 复用同一套 key）。ci_t0.yml 不装 sccache，它恢复同一个 c3build-<hash> 后
          # 即使不给 -D，CMake 也会沿袭那枚旧值 ⇒ 128 个 TU 全部
          # "CreateProcess failed: The system cannot find the file specified"。
          # 所以这里把「有 / 没有」写死成 configure 行的一部分，不让 CMakeCache 说了算。
          # 同理：sccache 装不上时（best-effort 失败）USE_SCCACHE 为空，这一次也会把残留值清掉。
          $launcher = ""
          if ($env:USE_SCCACHE -and (Test-Path $env:USE_SCCACHE)) { $launcher = $env:USE_SCCACHE }
          cmake -S . -B $buildDir -G Ninja -DVB6C3_ENABLE_LLVM=OFF -DCMAKE_BUILD_TYPE=Release "-DCMAKE_CXX_COMPILER_LAUNCHER=$launcher"
          if ($LASTEXITCODE -ne 0) { throw "cmake configure failed" }
          cmake --build $buildDir
          if ($LASTEXITCODE -ne 0) { throw "cmake build failed" }
          if ($launcher) { & $launcher --show-stats }
          New-Item -ItemType Directory -Force -Path .build | Out-Null
          Copy-Item (Join-Path $buildDir "C3.exe") .build\C3.exe -Force
          & .build\C3.exe --version
          if ($LASTEXITCODE -ne 0) { throw "built C3.exe smoke check failed" }

      # 构建步骤在 cache-hit 时被跳过，所以版本自证挪到这里无条件跑一遍（重建 / 缓存取回都验）。
      - name: Smoke check C3.exe (rebuilt or restored from cache)
        run: |
          if (-not (Test-Path .build\C3.exe)) { throw "C3.exe missing (cache restore failed?)" }
          & .build\C3.exe --version
          if ($LASTEXITCODE -ne 0) { throw "C3.exe broken (cache-restored?)" }

      - name: Upload C3.exe artifact (shared by all test jobs)
        uses: actions/upload-artifact@v7
        with:
          name: c3-exe
          path: .build/C3.exe
          if-no-files-found: error
          retention-days: 1

  # 账 #245 (§B73): 发码形状的**神谕必须来自产物那一台工具链**。同一笔提交用不同 MSVC 编出来的 C3.exe
  # 会在语料上分家（实测 788 份捕获里 14 份不同，全在 Charts 2020 的 UC 工程，形状只有一种：With 目标上
  # 的 COM 成员读走「带类型出口」还是「泛型出口」）—— 而门里 Build 与 Tests 用的是同一枚工件，这种漂移
  # 永远不会让门红；本机 A/B 又只能描述本机那枚的答案。这里按口径**不钉 VS 版本**（只要求 VS2019 及以上），
  # 改成让 CI 把自己那份答案留档：每个输入一行 sha256 + 产出它的工具链版本。
  # 先只留档、不判红（两侧清单现在已知差 14 行）；等 #245 的机制修掉、两份清单逐行相同之后，
  # 再把「与 checked-in 清单比对」升成硬判据。
  # 只跑 x64：实测两架构的差同号同形，多一档只把墙钟翻倍、覆盖不变。
  emit-manifest:
    name: "Emit manifest (shape oracle)"
    needs: build
    runs-on: windows-latest
    timeout-minutes: 30
    # 2026-10-09（用户拍口径②）：对 **PR 只报不挡**，推 dev 仍硬判红。
    # 为什么这一格天生容易红：它拿「全语料发码形状」对一张 checked-in 清单比，任何一次合法的 codegen
    # 改动都会让几十行哈希动 —— 那正是要看的读数，但对提 PR 的人来说它只是"我的 PR 挂了"。
    # 现在红话里带着三种成因与一条命令（scripts/rebless_emit_manifest.ps1，台账 §B100），PR 上仍然报、
    # 但不再挡合并；dev 是集成线，红由它挡（门红会顺 dev 传染，见 §B99/§B100 那两格）。
    continue-on-error: ${{ github.event_name == 'pull_request' }}
    permissions:
      contents: write   # 只给最后那一步：把清单用 git 推回 ci/emit-manifest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v5
        with:
          # fetch-depth 默认 1 = 浅克隆，而 git 拒绝从浅仓库 push。#413 侥幸推成功是因为那轮分支还
          # 不存在、走的是 --orphan（历史被切断，没有缺失的父提交）；#414/#415 基于已有 tip 叠提交就一直
          # 失败 —— 表现为"门全绿而 ci/emit-manifest 纹丝不动"（这一步按设计不判红）。
          fetch-depth: 0

      - name: Download C3.exe artifact
        uses: actions/download-artifact@v8
        with:
          name: c3-exe
          path: .build/

      - name: Hash the emitted C of every corpus input
        run: |
          pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/emit_manifest.ps1 -Out emit-manifest.txt
          if ($LASTEXITCODE -ne 0) { throw "emit_manifest.ps1 failed" }
          Get-Content emit-manifest.txt | Select-Object -First 3 | ForEach-Object { Write-Host $_ }

      - name: Upload emit manifest
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: emit-manifest
          path: emit-manifest.txt
          retention-days: 14

      - name: Upload raw emit samples (a few inputs, un-normalized)
        uses: actions/upload-artifact@v7
        with:
          name: emit-samples
          path: .build/emit-samples
          if-no-files-found: error
          retention-days: 14

      # 门读数过去全靠 api.github.com，而本机到它的通路是台本地反代（会整段拒：403 + Via: Caddy，
      # 带不带 token 都一样）。git 那条（github.com）是通的 —— 所以清单也走 git 送回来：
      # 每次把 emit-manifest.txt 提交到 ci/emit-manifest（这分支只由 CI 写，不进 dev 的历史），
      # 本机读它只要 `git fetch github ci/emit-manifest`。这一步失败**不判红**，只打一行 publish-failed。
      - name: Publish manifest over git
        if: always()
        env:
          CI_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Continue'
          $url = 'https://x-access-token:' + $env:CI_TOKEN + '@github.com/' + $env:GITHUB_REPOSITORY + '.git'
          git config user.email 'ci@users.noreply.github.com'
          git config user.name 'ci-emit-manifest'
          # 切到 ci/emit-manifest 之前必须先把手上这份清单挪出去：它位于仓库根、被 .gitignore 忽略，
          # 而 checkout 对"被忽略的未跟踪文件"是直接覆盖的 ⇒ 分支里那份旧的会把手上这份换掉，于是
          # add/commit 看不见任何变化、push 回 "Everything up-to-date" 也是退出 0。#414/#415 的
          # "门全绿、publish-ok、分支纹丝不动"就是这么来的（浅克隆那条是另一独立成因，见上面的 fetch-depth）。
          $hold = Join-Path $env:RUNNER_TEMP 'emit-manifest.publish.txt'
          Copy-Item emit-manifest.txt $hold -Force
          if (-not (Test-Path $hold)) { Write-Host 'publish-skipped: no manifest produced this run'; exit 0 }
          git fetch $url ci/emit-manifest 2>$null
          if ($LASTEXITCODE -eq 0) {
            git checkout -B ci/emit-manifest FETCH_HEAD
          } else {
            git checkout --orphan ci/emit-manifest
            git rm -rq --cached . 2>$null
          }
          Copy-Item $hold emit-manifest.txt -Force
          git add -f emit-manifest.txt
          $before = (git rev-parse --short HEAD)
          git commit -m ('ci: emit manifest head=' + $env:GITHUB_SHA.Substring(0,8))
          git push $url HEAD:refs/heads/ci/emit-manifest
          if ($LASTEXITCODE -eq 0) {
            # 自证：把远端 tip 读回来打一行。回读通道按 head 归属，所以这行就是"本机下一步该 fetch 谁"。
            $tip = (git ls-remote $url refs/heads/ci/emit-manifest 2>$null | ForEach-Object { ($_ -split "`t")[0] })
            Write-Host ('publish-ok: ci/emit-manifest base=' + $before + ' remote-tip=' + $tip)
          } else {
            Write-Host 'publish-failed (not a gate failure)'
          }
          exit 0

  regression:
    name: "Tests (${{ matrix.category }}${{ matrix.shard && format(' #{0}', matrix.shard) || '' }})"
    needs: build
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    strategy:
      fail-fast: false
      matrix:
        include:
          # smoke 是 run_tests.ps1 的 5 个 section 之一 (--syntax-only / compile / run / syntax
          # 四段各自有属, smoke 段只跑 tests_github/t0_cases/smoke.bas 的端到端编译+运行+断言).
          # 之前矩阵漏了它 → CI 里的"全量"其实差这一段.
          #
          # 分片数目按**实测单 job 墙钟**定的 (2026-09-28, run 36418025626):
          #   vbp 745s / 123 例 (最慢一例 41s, 分布很平) → 4 片 ≈ 4.6 min
          #   bas **保持 2 片** (见下)
          #   其余四类本来就 ≤1.3 min, 不分。
          # 关键路径 = build 3.5 min + max(bas#1, vbp  slowest shard) ≈ 8 min,
          # 原先 = build 3.3 + vbp 12.8 = 16.1 min (vbp 一类占 79%)。
          #
          # bas 试过 4 片, **实测没有收益**: 315s+258s (2 片) → 4.4/5.1/5.4/5.1 min (4 片),
          # 关键路径 5.5 → 5.4 min。原因是每个 shard 都要自己编那 65 个 RTL .c (~2.3 min),
          # 用例本身只占剩下的三分之一 —— 再切细, 摊到的用例还不够付第二次 RTL 编译。
          # 所以 bas 留在 2 片, 要提速得改成跨 runner 共享 obj store (artifact), 不是分片能解决的。
          #
          # 2026-10-23 提速 (门 #876 读数): vbp 4→8 片, 并给每个 test job 挂 actions/cache 共享
          # 那个内容寻址 obj store (%LOCALAPPDATA%\C3\objcache)。原来的死结就是「每个 shard 都要自己
          # 编那 65 个 RTL .c」—— store 一旦跨 runner 复用, RTL 全流水线只编一次, 分片才真能摊薄墙钟。
          # 实测 #876: build 272s + vbp 四片 704/528/479/449s, 既冗且不匀 (最重单片=704s, 单例最重
          # VBP-DLL=116s)。既然 RTL 那 2.3 min 的固定项被缓存吃掉, 才敢把片数翻倍。
          #
          # 加用例时不必动这里: 各分片都是按调用次序取模, 总数写不进代码。
          #
          # shardArgs 逐条显式写出, 不用 matrix.category 三元表达式拼 —— 拼出来的式子要同时
          # 照顾 bas/vbp 两套开关, 再加一个分类时很容易拼错 (GitHub 表达式不报错, 只会静默少传参)。
          - category: smoke
            shardArgs: ""
          - category: bas
            shard: 1
            shardArgs: "-BasShard 1 -BasShardTotal 2"
          - category: bas
            shard: 2
            shardArgs: "-BasShard 2 -BasShardTotal 2"
          # 2026-10-24 提速（门 #898 后的读数 40035228642）: 关键路径 = Build 24s（c3exe 命中直接
          # 跳过构建）+ max(vbp 八片) = 247s。vbp 8 → 11 片: 最慢一片按 247×8/11 ≈ 180s 摊薄。
          # 上限取 11 而不是更多: 本 job 的 job 总数 = 11(vbp) + bas 2 + smoke/compile/syntax/asm 4
          # + build + emit-manifest = 19, 顶到免费公共仓并发 20 的边（再多加就会排队, 墙钟反涨）。
          # 且 emit-manifest 本身就 177s, 把 vbp 压到 180s 以下收益会被它接住 —— 下一刀该切它。
          #
          # 2026-10-24 第二刀（真实 push 流 40044645228 的读数）: 11 片的实测是
          #   226/219/205/186/182/177/164/159/148/143/135s, 合计 2012s、平均 182s、最重 226s。
          # ⇒ 11 → 12 片: 理论 max 2012/12 ≈ 168s; 12 片正好把 job 总数填到 20（并发上限，不再加）。
          # 这一步只动片数、不改 Enter-VbpShard 的取模口径 —— 加权切片需要一个"每用例代价表",
          # 而 run_tests.ps1 里没有这张表（409 个槽靠 $script:VbpCaseNo++ 递增取模），凭空造表
          # 反而要长期维护 ⇒ 不加片以外的手段只有"把轻格合并腾名额", 那一步等这轮读数再定。
          # 附带提醒: 12 片意味着 #12 是新 key（objcache 按 job 分键）⇒ 它的**首轮**是冷的,
          # 判据只认第二轮（见 ci_t0 侧同一条记录）。
          - category: vbp
            shard: 1
            shardArgs: "-VbpShard 1 -VbpShardTotal 12"
          - category: vbp
            shard: 2
            shardArgs: "-VbpShard 2 -VbpShardTotal 12"
          - category: vbp
            shard: 3
            shardArgs: "-VbpShard 3 -VbpShardTotal 12"
          - category: vbp
            shard: 4
            shardArgs: "-VbpShard 4 -VbpShardTotal 12"
          - category: vbp
            shard: 5
            shardArgs: "-VbpShard 5 -VbpShardTotal 12"
          - category: vbp
            shard: 6
            shardArgs: "-VbpShard 6 -VbpShardTotal 12"
          - category: vbp
            shard: 7
            shardArgs: "-VbpShard 7 -VbpShardTotal 12"
          - category: vbp
            shard: 8
            shardArgs: "-VbpShard 8 -VbpShardTotal 12"
          - category: vbp
            shard: 9
            shardArgs: "-VbpShard 9 -VbpShardTotal 12"
          - category: vbp
            shard: 10
            shardArgs: "-VbpShard 10 -VbpShardTotal 12"
          - category: vbp
            shard: 11
            shardArgs: "-VbpShard 11 -VbpShardTotal 12"
          - category: vbp
            shard: 12
            shardArgs: "-VbpShard 12 -VbpShardTotal 12"
          # compile 拆两格（2026-10-24 第三刀）。读数依据 run 40046664271（vbp 已到 12 片的
          # 那一轮）：vbp 最重降到 191s，而 **Tests (compile) 227s 接手成了新瓶颈** —— 这一格
          # 224s 里的构成是「~100 个静态 census 158s + 10 例真编 17s + 固定开销」，跟名字给人的
          # 印象正好相反。census 是纯扫源的检查、互不依赖，所以按 $StaticShard 对半切。
          # ⚠ 真编只归片 1（-SkipRealCompile 反之）：objcache 的键含 job 名，片 2 拿不到片 1
          #   编出来的 obj，会从零重编 65 个 RTL .c（~2.3min），比省下的 17s 还多。
          # 代价: job 总数 20 → 21，超出免费公共仓并发 20 一个 —— 但 Build(20s)/smoke(42s)/
          #   syntax(37s) 都很快让位，第 21 个 job 立刻能被调度，不涨墙钟。
          # 另注: 片 1 的 objcache 键从 `compile` 变成 `compile1` ⇒ **首轮是冷的**，判据只认第二轮。
          - category: compile
            shard: 1
            shardArgs: "-StaticShard 1 -StaticShardTotal 2"
          - category: compile
            shard: 2
            shardArgs: "-StaticShard 2 -StaticShardTotal 2 -SkipRealCompile"
          - category: syntax
            shardArgs: ""
          - category: asm
            shardArgs: ""
    env:
      C3_VCVARSALL: ""
    steps:
      - uses: actions/checkout@v5

      - name: Download C3.exe artifact
        uses: actions/download-artifact@v8
        with:
          name: c3-exe
          path: .build/

      - name: Smoke check downloaded C3.exe
        run: |
          & .build\C3.exe --version
          if ($LASTEXITCODE -ne 0) { throw "downloaded C3.exe broken" }

      # 内容寻址的增量 obj store（本机实测 2656 个 .obj / 51 MB，其中 vb6* 那批 RTL 类对象 663 枚/~16 MB）。
      # -Incremental 下每个 job 的第一例真编那 65 个 RTL .c (~2.3 min)；store 的键只含 {架构, 工具串,
      # RTL 源内容}，所以错配的 obj 只会没命中、绝不会被用错（见 ai/030 §六）—— 跨 run 缓存是安全的。
      #
      # 为什么 key 里带 matrix.category+shard，而不是一个全流水线共用的 key：actions/cache 对**同一个 key**
      # 只让本 run 里**最先跑完的那个 job**落盘，其余全被 "already exists" 顶掉。实测门 #877（run
      # 39939573105）：最先结束的是最轻的 Tests (syntax)(40s)，它落下的 store 只有 **581 KiB**（几乎是空的，
      # RTL 一个都没进去）⇒ 那一轮 cache 等于没存，重引那 2.3 min 白省。分键之后每个 job 各自存/读自己那份
      # warmed store，冷启动一轮后全体命中，再不会被先跑完的轻活顶掉。x86/x64 的 obj 同处一店（架构本就是
      # 键的一部分），所以不必按架构拆；这里拆的是 **job**，不是架构。
      # key 带 src 哈希：RTL 改动即换 key，旧 entry 自然过期；restore-keys 用去哈希的前缀，兜住"src 动了
      # 但 RTL 没动"那一档（仍能命中原 obj；只有 RTL 真变了才重编）。
      # 路径是 GitHub 托管 Windows runner 的固定用户目录；万一哪天换了用户名，也只是 cache miss（不判红）。
      - name: Cache C3 incremental obj store (per-job, content-addressed)
        # compile 片 2 只跑静态 census、一例都不真编 ⇒ 它不需要 obj store，跳过免得白恢复
        # 一份 15MB 的空 store（也更省 cache 配额）。其余格子照旧。
        if: ${{ !(matrix.category == 'compile' && matrix.shard == 2) }}
        uses: actions/cache@v6
        with:
          path: C:\Users\runneradmin\AppData\Local\C3\objcache
          key: c3objcache-${{ runner.os }}-${{ matrix.category }}${{ matrix.shard }}-${{ hashFiles('src/**', 'CMakeLists.txt', 'cmake/**') }}
          restore-keys: |
            c3objcache-${{ runner.os }}-${{ matrix.category }}${{ matrix.shard }}-

      # run_tests.ps1 内: 纯 .bas 用例支持 -Jobs 并行 (每个 worker 独立输出目录) 与
      # -BasShard 分片 (CI 用多 runner 并行跑 bas 用例); VBP/GUI 用例始终**在本 runner 内**串行
      # (GUI 窗口效果无法通过自动校验在同一台机器上并行确认), 但**跨 runner 分片**是另一回事:
      # 分到不同 runner = 不同虚拟机, 隔离性比同机并行更强, 所以 -VbpShard 不违反上面这条。
      # ai/030 §六/§十: 加 -Incremental ⇒ 每个 job 里只有第一例真编那 65 个 RTL .c，其余吃
      # 内容寻址的 obj store（本机实测：单工程 22.0 s → 2.8 s，15 例 bas 282 s → 36 s）。
      # store 是 runner 本地的、跑完即弃 ⇒ 产 obj 的机器与用 obj 的机器同一台，不跨机错配。
      # 编译器自己的默认路径仍是关的；要退回今天这条老路，删掉这个开关即可。
      - name: "Run regression (${{ matrix.category }}${{ matrix.shard && format(' #{0}', matrix.shard) || '' }})"
        shell: pwsh
        run: |
          # §B92：门红的时候本机只拿得到「exit code 1」—— job 日志与 artifact 端点要 actions:read，
          # remote 内嵌那把凭据没有这一档 ⇒ 过去只能靠排除法猜「红在哪一枚夹具」（门 #418 就这么糊过去一次）。
          # 这一层不动 harness（它 66 个前缀点 / 80 个计票点，全改等于重写），只认它**已经打出来**的行：
          #   "  [类别] <用例名> ... <读数>" ⇒ 转成 ::error:: 注解，之后本机用匿名可读的
          #   /repos/<o>/<r>/check-runs/<job-id>/annotations 就能直接点名。判红口径一字没改（仍看 run_tests 的退出码）。
          # 一行不落照原样打到控制台（CI 那份日志与今天完全一致），同时把**剥掉颜色码**的行留在内存里判排版。
          # 故意不写中间文件：Tee-Object 落盘的编码在 5.1 是 UTF-16、在 7 是 UTF-8，回读时把另一方的行当乱码 ——
          # 这条通道不能建在「文件编码刚好对」上（本机复算就是这么把注解判成 0 条的，靠自证那条才发现）。
          $ansi = [char]27 + "\[\??[0-9;]*[a-zA-Z]"
          $clean = New-Object System.Collections.Generic.List[string]
          pwsh -NoProfile -ExecutionPolicy Bypass -File tests/run_tests.ps1 -Category ${{ matrix.category }} -Jobs 20 ${{ matrix.shardArgs }} -Incremental -Verbose *>&1 | ForEach-Object { $s = [string]$_; Write-Host $s; $clean.Add(($s -replace $ansi, "")) } | Out-Null
          $rc = $LASTEXITCODE
          # 只在红的时候点名：绿轮里这条通道一声不出。前缀行是 -NoNewline 写的，万一被别人的换行截断，
          # 「不是 PASS 就算失败」会在绿轮凭空点出名字来 —— 把这条限制钉死，注解面就只剩「红」这一种输入。
          if ($rc -eq 0) { exit 0 }
          # 注解正文一律 ASCII：Write-Host 的中文会被按系统代码页重编码（本机复算时两条自证行整条变 U+FFFD，
          # 与账 #267 的 --emit-c 同一个根），而用例名/类别本来就是 ASCII —— 点名不靠中文，报错的行更不能靠它。
          # 捕获组只能走正则对象：字符串上并没有 Matches 这个成员，写成 $_.Matches 的话命中了行也在取组那步抛 NullArray、
          # 注解照样 0 条（本机第一版就是这么红的）。尾巴 (.*) 非收不可：harness 66 个前缀点后面接的 FAIL 有 77 个 token、
          # 其中 26 个带原因（FAIL (compile) / FAIL rc=… / FAIL: a | b），另有几个计票点压根不打 FAIL 字样、
          # 只打一行 DarkGray 读数 —— 所以判据是「用了例行的排版、且收尾不是 PASS/SKIP」，读数原样带进注解（它比 FAIL 五个字值钱）。
          $rx = [regex] "^\s*\[(.+?)\]\s+(.+?)\s*\.\.\.\s*(.*)$"
          # 第二种排版（门 #538 的实物）：并行那条路（jobs>1 的汇总分支）打的不是 `<名字> ... <判定>`，
          # 而是 `  [RUN] <用例名>: <原因>`（run_tests.ps1 的 $details 六条：compile FAIL / no exe /
          # run timeout / run error / output mismatch / 编译无 error C 行）。那两条 test_variant_boxing
          # 就是这么「数得着、点不出名」的 —— 自救面在最需要它的时候哑了一次。
          # 所以这里问的是**同一条判据的第二种拼法**（名字与原因之间是冒号），而不是往 $named 里再手抄一份名单。
          $rx2 = [regex] "^\s*\[(.+?)\]\s+([^:\[\]]+?):\s+(.+)$"
          $named = @($clean | ForEach-Object {
              $m = $rx.Match($_)
              if (-not $m.Success) { $m = $rx2.Match($_) }
              if (-not $m.Success) { return }
              $tail = $m.Groups[3].Value.Trim()
              if ($tail -match "^(PASS|SKIP)") { return }
              if ($tail -eq "") { $tail = "(no verdict token)" }
              "[" + $m.Groups[1].Value.Trim() + "] " + $m.Groups[2].Value.Trim() + " ... " + $tail
            })
          foreach ($n in @($named | Select-Object -First 40)) { Write-Host ("::error::" + $n) }
          if ($named.Count -gt 40) { Write-Host ("::error::more than 40 failing cases, annotating the first 40 (total " + $named.Count + ")") }
          # 自证：这条通道按设计不判红，所以它得自己说「这次的点名能不能信」—— 三档都不许静默。
          if ($named.Count -eq 0) {
            Write-Host ("::error::run_tests exit code " + $rc + " but no case line matched -- the matcher is out of sync with the harness output, fix this cell")
          }
          # harness 全程只打一行 Results（tests/run_tests.ps1 里唯一一处），那就是它自己数出来的失败条数。
          $tally = 0
          $rxT = [regex] "Results:.*FAIL=(\d+)"
          foreach ($l in $clean) { $mt = $rxT.Match($l); if ($mt.Success) { $tally = [int]$mt.Groups[1].Value } }
          if ($tally -eq 0) {
            Write-Host "::error::no run_tests Results line -- naming is not trustworthy (the run may have stopped before the summary)"
          } elseif ($named.Count -lt $tally) {
            Write-Host ("::error::harness tallied " + $tally + " failures but naming found only " + $named.Count + " -- some failure lines are outside the matcher, fix this cell")
          }
          exit $rc

      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: "test-logs-${{ matrix.category }}${{ matrix.shard && format('-{0}', matrix.shard) || '' }}"
          path: |
            output/**/*.out
            output/**/*.err
            output/**/*.txt
            output/**/*.dat
            output/**/scores.txt
          if-no-files-found: warn
          retention-days: 14