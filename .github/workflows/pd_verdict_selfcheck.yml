name: Verdict self-check (must go RED)

# 探针分支专用自检：证明 pd_build_probe.yml 里的 **Verdict (exe must exist)** 那一步
# 在没有 exe 时真的让 job 变红，而不是只在日志里打一行字。
#
# 做法：伪造 .build/pd_build.meta（EXE_EXISTS=False），把 Verdict 那段原样抄过来跑一遍。
# **期望结论 = failure**：这个 workflow 红了才叫自检通过（绿了说明 Verdict 没起作用）。
# 跑完即删，不常驻（它不是门，是一次性证据）。

on:
  workflow_dispatch:
  # workflow_dispatch 要求该文件已在默认分支上；探针分支上的一次性自检用 push 自触发
  # （只匹配本文件，不会连带 pd_build_probe 那两小时的整编）。
  push:
    paths:
      - '.github/workflows/pd_verdict_selfcheck.yml'

jobs:
  selfcheck:
    name: verdict-selfcheck (expected FAILURE)
    runs-on: windows-latest
    timeout-minutes: 5
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v5

      - name: Fabricate meta with no exe
        run: |
          New-Item -ItemType Directory -Force -Path .build | Out-Null
          @('BUILD_EXIT=1','EXE_EXISTS=False','BUILD_SECONDS=0.0','PEAK_TREE_WS_MB=0','MIN_FREE_PHYS_MB=0') |
            Set-Content -Path .build\pd_build.meta -Encoding utf8
          Get-Content .build\pd_build.meta

      - name: Verdict (exe must exist) — same body as pd_build_probe.yml
        if: always()
        run: |
          $meta = Get-Content .build\pd_build.meta -ErrorAction SilentlyContinue
          Write-Host "===== BUILD VERDICT ====="
          foreach ($k in @('BUILD_EXIT','EXE_EXISTS','BUILD_SECONDS','PEAK_TREE_WS_MB','MIN_FREE_PHYS_MB')) {
            $hit = $meta | Where-Object { $_ -like "$k=*" } | Select-Object -First 1
            Write-Host ($(if ($hit) { $hit } else { "$k=<missing>" }))
          }
          $exeLine = $meta | Where-Object { $_ -like 'EXE_EXISTS=*' } | Select-Object -First 1
          if (-not $exeLine -or $exeLine -notmatch 'EXE_EXISTS=True') {
            Write-Error "PhotoDemon x86 full build produced NO exe (see photodemon-full-build-logs artifact)"
            exit 1
          }
          Write-Host "OK: exe produced"
